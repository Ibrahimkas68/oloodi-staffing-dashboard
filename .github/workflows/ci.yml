name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The values below are throwaway credentials for the database service of this job only.
env:
  POSTGRES_DB: staffing
  POSTGRES_OWNER_USER: staffing_owner
  POSTGRES_OWNER_PASSWORD: staffing_owner_ci
  APP_DB_PASSWORD: staffing_app_ci
  DATABASE_URL: postgres://staffing_app:staffing_app_ci@localhost:5432/staffing
  DATABASE_OWNER_URL: postgres://staffing_owner:staffing_owner_ci@localhost:5432/staffing

jobs:
  checks:
    name: Typecheck, lint, tests, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: staffing
          POSTGRES_USER: staffing_owner
          POSTGRES_PASSWORD: staffing_owner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U staffing_owner -d staffing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Known vulnerabilities in the dependencies that ship in the production image.
      - run: npm audit --omit=dev

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: staffing
          POSTGRES_USER: staffing_owner
          POSTGRES_PASSWORD: staffing_owner_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U staffing_owner -d staffing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
