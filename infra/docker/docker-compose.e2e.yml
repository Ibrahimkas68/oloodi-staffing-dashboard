# End-to-end tests in containers. Separate from docker-compose.yml on purpose: it has its own
# project name, its own throwaway database and publishes no ports, so it can run next to the demo
# stack (and never touches its data).
#
# Run from the repository root (infra/scripts/e2e-docker.sh does both steps and always cleans up):
#   docker compose -f infra/docker/docker-compose.e2e.yml up --build --abort-on-container-exit --exit-code-from e2e
#   docker compose -f infra/docker/docker-compose.e2e.yml down -v

name: staffing-e2e

# One definition of the database, shared by the app under test and the test runner. The runner
# resets this database between tests, so both must always point at the same one.
x-e2e-database: &e2e-database
  APP_DB_PASSWORD: staffing_app_e2e
  DATABASE_URL: postgres://staffing_app:staffing_app_e2e@db-e2e:5432/staffing_e2e
  DATABASE_OWNER_URL: postgres://staffing_owner:staffing_owner_e2e@db-e2e:5432/staffing_e2e

services:
  db-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: staffing_e2e
      POSTGRES_USER: staffing_owner
      POSTGRES_PASSWORD: staffing_owner_e2e
    # Throwaway data in memory. No named volume, no published port.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      # TCP check: see the note in docker-compose.yml.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 20

  app-e2e:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    # Same tag as the demo stack, so the image is built once and shared.
    image: staffing-app:local
    depends_on:
      db-e2e:
        condition: service_healthy
    environment:
      <<: *e2e-database
      PORT: 3000
      NODE_ENV: production
      LOG_LEVEL: warn
      # The tests fire many requests in a short time.
      RATE_LIMIT_PER_MINUTE: 10000
      DEMO_MODE: 'false'
    # The healthcheck comes from the image. No ports: only the runner needs to reach it.

  e2e:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.e2e
    image: staffing-e2e:local
    depends_on:
      app-e2e:
        condition: service_healthy
    init: true
    # Chromium can run out of shared memory in a container; sharing the host IPC namespace avoids it.
    ipc: host
    environment:
      <<: *e2e-database
      CI: 'true'
      # Both are required together: they switch the tests to "app already running elsewhere" mode.
      E2E_BASE_URL: http://app-e2e:3000
      E2E_DB_HOST: db-e2e
    volumes:
      # Only the reports leave the container.
      - ../../e2e/playwright-report:/repo/e2e/playwright-report
      - ../../e2e/test-results:/repo/e2e/test-results
